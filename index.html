<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-personal.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E53935" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Personal" />
    <link rel="apple-touch-icon" href="/icon-personal.svg" />
    <title>Command Personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0e1320; overflow: hidden; }
      @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
      @keyframes pulseGlow { 0%,100%{opacity:0.7} 50%{opacity:1} }
      @keyframes pulseDot { 0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,0.5)} 50%{box-shadow:0 0 0 6px rgba(76,175,80,0)} }
      @keyframes todayPulse { 0%,100%{box-shadow:0 0 8px rgba(0,0,0,0.1)} 50%{box-shadow:0 0 20px rgba(0,0,0,0.15)} }
      @keyframes fadeSlideIn { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
      @keyframes fabPulse { 0%,100%{box-shadow:0 4px 30px rgba(59,91,219,0.18),0 1px 4px rgba(0,0,0,0.06)} 50%{box-shadow:0 4px 30px rgba(59,91,219,0.18),0 1px 4px rgba(0,0,0,0.06),0 0 0 8px rgba(239,83,80,0.1)} }
      @keyframes fabSlideUp { 0%{opacity:0;transform:translateY(16px) scale(0.85)} 100%{opacity:1;transform:translateY(0) scale(1)} }
      @keyframes arcPulse { 0%{opacity:0.85;transform:scale(0.5)} 100%{opacity:0;transform:scale(2.4)} }
      @keyframes eq1 { 0%{transform:scaleY(0.58);animation-timing-function:cubic-bezier(0.02,0.99,0.1,1)} 6%{transform:scaleY(0.96);animation-timing-function:cubic-bezier(0.6,0,0.85,0.1)} 24%{transform:scaleY(0.60);animation-timing-function:cubic-bezier(0.02,0.99,0.1,1)} 31%{transform:scaleY(0.84);animation-timing-function:cubic-bezier(0.6,0,0.85,0.1)} 49%{transform:scaleY(0.58);animation-timing-function:cubic-bezier(0.02,0.99,0.1,1)} 56%{transform:scaleY(0.95);animation-timing-function:cubic-bezier(0.6,0,0.85,0.1)} 74%{transform:scaleY(0.60);animation-timing-function:cubic-bezier(0.02,0.99,0.1,1)} 81%{transform:scaleY(0.83);animation-timing-function:cubic-bezier(0.6,0,0.85,0.1)} 100%{transform:scaleY(0.58)} }
      @keyframes eq2 { 0%{transform:scaleY(0.62);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 12%{transform:scaleY(0.88);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 58%{transform:scaleY(0.66);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 74%{transform:scaleY(0.84);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 100%{transform:scaleY(0.62)} }
      @keyframes eq3 { 0%{transform:scaleY(0.55);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 13%{transform:scaleY(0.85);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 55%{transform:scaleY(0.60);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 70%{transform:scaleY(0.80);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 100%{transform:scaleY(0.55)} }
      @keyframes eq4 { 0%{transform:scaleY(0.52);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 11%{transform:scaleY(0.95);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 60%{transform:scaleY(0.56);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 76%{transform:scaleY(0.90);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 100%{transform:scaleY(0.52)} }
      @keyframes eq5 { 0%{transform:scaleY(0.64);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 10%{transform:scaleY(0.82);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 45%{transform:scaleY(0.68);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 62%{transform:scaleY(0.86);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 85%{transform:scaleY(0.65);animation-timing-function:cubic-bezier(0.04,0.98,0.18,1)} 94%{transform:scaleY(0.80);animation-timing-function:cubic-bezier(0.5,0,0.8,0.15)} 100%{transform:scaleY(0.64)} }
      @keyframes eqOp { 0%,100%{opacity:0.85} 50%{opacity:1} }
      @keyframes textPulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
      @keyframes rhythmWave { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
      @keyframes rhythmGlow { 0%,100%{opacity:0.18} 40%{opacity:0.35} 70%{opacity:0.12} }
      @keyframes eqBand1 { 0%,100%{transform:scaleY(0.07)} 8%,22%{transform:scaleY(0.06)} 14%{transform:scaleY(0.68)} 50%,95%{transform:scaleY(0.05)} }
      @keyframes eqBand2 { 0%,100%{transform:scaleY(0.08)} 20%,45%{transform:scaleY(0.06)} 32%{transform:scaleY(0.55)} 70%,92%{transform:scaleY(0.07)} 80%{transform:scaleY(0.42)} }
      @keyframes eqBand3 { 0%,100%{transform:scaleY(0.06)} 10%,30%{transform:scaleY(0.05)} 18%{transform:scaleY(0.78)} 60%,90%{transform:scaleY(0.06)} 75%{transform:scaleY(0.32)} }
      @keyframes eqBand4 { 0%,100%{transform:scaleY(0.09)} 15%,40%{transform:scaleY(0.07)} 26%{transform:scaleY(0.62)} 65%,88%{transform:scaleY(0.05)} 74%{transform:scaleY(0.85)} }
      @keyframes eqBand5 { 0%,100%{transform:scaleY(0.07)} 25%,55%{transform:scaleY(0.06)} 38%{transform:scaleY(0.72)} 78%,96%{transform:scaleY(0.05)} 86%{transform:scaleY(0.48)} }
      @keyframes eqBand6 { 0%,100%{transform:scaleY(0.06)} 5%,28%{transform:scaleY(0.05)} 16%{transform:scaleY(0.58)} 55%,85%{transform:scaleY(0.06)} 68%{transform:scaleY(0.76)} }
      @keyframes eqBand7 { 0%,100%{transform:scaleY(0.08)} 30%,60%{transform:scaleY(0.06)} 44%{transform:scaleY(0.65)} 80%,94%{transform:scaleY(0.07)} 88%{transform:scaleY(0.38)} }
      @keyframes eqBand8 { 0%,100%{transform:scaleY(0.07)} 12%,35%{transform:scaleY(0.05)} 22%{transform:scaleY(0.82)} 62%,90%{transform:scaleY(0.06)} 78%{transform:scaleY(0.52)} }
      @keyframes eqBandOp { 0%,100%{opacity:0.75} 50%{opacity:1} }
      .eq-b0{animation:eqBand1 28s ease-in-out infinite -0s}
      .eq-b1{animation:eqBand2 33s ease-in-out infinite -3.5s}
      .eq-b2{animation:eqBand3 26s ease-in-out infinite -1.2s}
      .eq-b3{animation:eqBand4 35s ease-in-out infinite -5.8s}
      .eq-b4{animation:eqBand5 29s ease-in-out infinite -2.4s}
      .eq-b5{animation:eqBand6 31s ease-in-out infinite -7.1s}
      .eq-b6{animation:eqBand7 24s ease-in-out infinite -4.3s}
      .eq-b7{animation:eqBand8 37s ease-in-out infinite -6.5s}
      @keyframes emberFloat { 0%{transform:translateY(0) translateX(0);opacity:0} 12%{opacity:0.85} 88%{opacity:0.25} 100%{transform:translateY(-52px) translateX(3px);opacity:0} }
      @keyframes emberFloat2 { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:0.7} 85%{opacity:0.2} 100%{transform:translateY(-44px) translateX(-4px);opacity:0} }
      @keyframes emberFloat3 { 0%{transform:translateY(0) translateX(0);opacity:0} 15%{opacity:0.9} 90%{opacity:0.3} 100%{transform:translateY(-58px) translateX(2px);opacity:0} }
      @keyframes vesselGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes scoreBlob1 { 0%,100%{transform:translate(0px,0px);opacity:0.18} 33%{transform:translate(28px,-18px);opacity:0.28} 66%{transform:translate(-15px,22px);opacity:0.14} }
      @keyframes scoreBlob2 { 0%,100%{transform:translate(0px,0px);opacity:0.13} 40%{transform:translate(-22px,16px);opacity:0.22} 75%{transform:translate(18px,-14px);opacity:0.09} }
      @keyframes scoreBlob3 { 0%,100%{transform:translate(0px,0px);opacity:0.11} 55%{transform:translate(14px,20px);opacity:0.19} 80%{transform:translate(-10px,-18px);opacity:0.08} }
      .score-blob-1{animation:scoreBlob1 13s ease-in-out infinite}
      .score-blob-2{animation:scoreBlob2 17s ease-in-out infinite -5s}
      .score-blob-3{animation:scoreBlob3 11s ease-in-out infinite -8s}
      @keyframes bubbleRise { 0%{transform:translateY(0) scale(1);opacity:0} 8%{opacity:0.9} 80%{opacity:0.45} 100%{transform:translateY(-58px) scale(0.3);opacity:0} }
      input[type=range].goal-slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:transparent;outline:none;cursor:pointer;}
      input[type=range].goal-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.5);border:2px solid var(--goal-color,#FF7043);transition:transform 0.15s;}
      input[type=range].goal-slider::-webkit-slider-thumb:hover{transform:scale(1.25);}
      input[type=range].goal-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.5);border:2px solid var(--goal-color,#FF7043);}
      @media(max-width:768px){
        .biz-grid{grid-template-columns:1fr !important;}
        .cal-cell{min-height:72px !important;padding:2px !important;}
        .cal-cell span{font-size:11px !important;}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(r => r.forEach(sw => sw.unregister()));
        caches.keys().then(k => k.forEach(c => caches.delete(c)));
      }
    </script>
  </body>
</html>
